name: Project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-host.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: python -m pip install -r requirements-api.txt "pytest>=8,<10" "matplotlib>=3.9,<4"
      - run: python -m pip check
      - run: python -m compileall -q adaptive_defense dashboard.py serve.py
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose -f compose.web.yaml config --quiet
